[project]
name = "shriram-estamp"
version = "0.1.0"
description = "Shriram Finance eStamp automation – inventory intake, LAN allocation, outputs."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "psycopg[binary]>=3.1.18",
    "psycopg-pool>=3.2",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",  # tests build sample PDFs
]

# Application, not a library: no build step, run via `uv run python -m estamp`.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]   # project root importable in every test (replaces per-file sys.path hacks)
