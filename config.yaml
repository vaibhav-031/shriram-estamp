# Shriram eStamp – Python service config. Secrets go in .env, not here.

client_name: Shriram Finance

# true  = preview only: reads + OCRs, writes the "Dry Run Preview" tab, moves NOTHING, writes NOTHING to the ledger
# false = live
dry_run: true              # locked 2026-10-27: test in dry run only (test data cleared). Live needs Vaibhav's OK.

timezone: Asia/Kolkata
workers: 8                 # parallel threads for OCR / allocation (6–8 is safe for Drive API limits)
loop_seconds: 120          # `run` mode: start a new cycle every N seconds
cycle:
  max_seconds: 900         # time budget per cycle (intake is time-boxed inside this)

db:
  url_env: ESTAMP_DB_URL   # name of the env var holding the Postgres URL
  schema: shriram_estamp   # everything lives in this schema only

google:
  auth: oauth              # oauth = your Google account (Mac pilot) | service_account (server, Shared Drive only)
  account: procurement@zoop.one   # every laptop must sign in as this ONE account, so all ops see the same Drive
  oauth_client_file: secrets/client_secret.json
  oauth_token_file: secrets/token.json
  service_account_file: secrets/service_account.json

# Drive folder IDs – ALL inside the Shared Drive "Shriram Finance eStamps" (0AECjrUF6gCffUk9PVA), owned by the
# org, used as procurement@zoop.one. Nothing outside that Shared Drive is ever touched (CLAUDE.md).
folders:
  upload_inbox:     1oUlqWYotKUl82uzrMLmiX5UObt7VKdFJ   # 1 · 📥 Upload Inbox – ops upload vendor PDFs (inside a vendor subfolder)
  orders_incoming:  1X4JsBz-vb7nnqcmUaqJ1SpzRYrs8UnaB   # 2 · 📥 Orders Incoming – Shriram's state LAN sheets
  needs_review:     1xa1UnrIWfZlOf3sdrHD4JPkR8EPZSzfU   # 3 · ⚠️ Needs Review – papers that failed a check
  output_root:      1Dc4bpQxBWxszS5bo9BEZhw81znc9VfZz   # 4 · 📤 Output – DATE/STATE/<STATE-AMOUNT> sheet + PDFs
  # D-2/D-3 `report`: DATE/<Daily Report> (ops-manager daily figures + vendor reconciliation).
  # Live-only: config.dryrun.yaml deliberately has no reconciliation_root, so a dry-run report cannot overwrite these.
  reconciliation_root: 10Mg5K5iIGaaUiJKhI-GVd9ameuwXmfLO   # 5 · 💰 Reconciliation
  # ⚙️ System — do not touch/
  inventory_root:   1KuzxaJjx7dtf7-lILdl6v91Ys65HThjE   # STATE/AMOUNT/<CERT>.pdf – created automatically
  backup_root:      1dMFD3nUc_UajGeTroGPgpwmwzwScFrdm   # DATE/STATE/AMOUNT/<LAN>__<CERT>.pdf
  upload_archive:   1h5Ukpeh-VvGCVTJ_s-j18Zk7g1JqHTrf   # originals after processing (never deleted)
  orders_processed: 12ezTHCWyVD4aTBgDwclIfNccBFT2vvjp
  orders_rejected:  1e7UglPqjTCIu6TFV6Zk8cjvrBp50nihl

control_sheet_id: 1beTcMqITQUOJdafBVoO7_tyO0-y9sIk1fMiisLtjLRM   # Shriram eStamp Control (Python), Shared Drive root

state_config_file: state_config.csv
vendors_file: vendors.csv

orders:
  settle_minutes: 0          # ignore sheets edited in the last N minutes (someone may still be filling them)
  header_scan_rows: 10
  lan_regex: '^[A-Za-z0-9][A-Za-z0-9\-_/]{3,39}$'   # tighten once Shriram's LAN format is confirmed
  reject_file_on_any_invalid_row: false
  max_rows_per_tab: 50000     # a tab with more filled rows is refused whole (E201) instead of eating the cycle budget
  columns:                    # header names are matched case/punctuation-insensitively
    lan: [loan no, loan number, loan no., lan id, lan, lan no, lan number, loan account number, loan account no]
    state: [state, state code, state name]
    denomination: [stamp duty amount, stamp duty, denomination, stamp value, stamp amount]

intake:
  settle_minutes: 3           # ignore uploads still being copied in (Drive for Desktop syncs; grace to pull back a wrong upload)
  # A-08/D1: an upload whose OCR keeps failing stays in the inbox and is retried next cycle; once it has been
  # failing for longer than this window the WHOLE upload moves to Needs Review (alert + reason), not forever.
  ocr_fail_give_up_minutes: 30
  max_upload_mb: 50           # M-4: a bigger upload goes whole to Needs Review (E108) before any OCR call
  # Switched to the in-house APIs 2026-10-27 (A-05, A-07, Phase B green). D1: one reader, no silent fallback.
  # Pages per paper are decided from the OCR'd IDs (ADR-0006) – state_config.csv → pages_per_paper.
  split_provider: zoop_api    # local (pypdf) | zoop_api
  ocr_provider: zoop_api      # in-house OCR API – the only reader; on failure it raises, no fallback (D1)
  required_text: []           # e.g. ["SHRIRAM"] – turn on once sample papers confirm the party name prints
  cert_patterns:
    DEFAULT: '\bIN-([A-Z]{2})(\d{12,16})([A-Z])'      # SHCIL style IN-MH12345678901234X; group 1 = state
    # MH: '\bIN-MH\d{14}[A-Z]'                         # add per-state patterns once samples are in
  stamp_duty_regex: 'STAMP\s*DUTY\s*AMOUNT[^0-9]{0,25}([\d,]+)'
  # Physical (non-judicial) stamp paper: serial number on the front, state printed as a name (RAJASTHAN).
  # The paper id becomes STATE-SERIAL, e.g. RJ-S254201. Add per-state patterns as you see more samples.
  serial_patterns:
    DEFAULT: '\b[A-Z]{1,2} ?\d{6}\b'               # e.g. "S 254201", "AB 123456"
  # Amount: tried in order – e-stamp line first, then the face value printed on physical paper
  # e-stamp fallback id when the certificate no. isn't readable as text (group 1 = state code)
  estamp_ref_patterns:
    # UP: SUBIN-UPUP1405480472263158537115Y   KA: SUBIN-KAKAKSCSA0817022928679844Y (office code before the digits)
    - '\bSUBIN-([A-Z]{2})[A-Z]{2}(?=[A-Z0-9]*\d{12})[A-Z0-9]{16,34}\b'
  amount_patterns:
    - '([\d,]+)\s*\(\s*[A-Z][A-Z ]*ONLY\s*\)'          # "100 (One Hundred only)" – most reliable on e-stamps
    - 'STAMP\s*DUTY\s*AMOUNT\s*\(RS\.?\)\s*:?\s*([\d,]+)'
    - '\bRS\.?\s*([\d,]+)'
    - 'रु\.?\s*([\d,]+)'
    # last resort: watermark text OCR'd between label and value, e.g. "Stamp Duty Amount (Rs.) RAM FINANCE LIMITE: 500"
    - 'STAMP\s*DUTY\s*AMOUNT[^0-9]{0,45}?([\d,]+)'

allocation:
  batch_size: 200
  max_per_cycle: 3000
  cancel_returns_paper: true  # CANCEL on an issued LAN puts the paper back in stock
  verify_ocr: true            # OCR the renamed <LAN>.pdf again; the Certificate No written to the Output
                              # sheet is the one read from that issued PDF (must match the ledger)

zoop_api:                     # fill in when the in-house APIs are ready
  split:                      # contract: docs/api-samples/split/README.md (no auth)
    url: https://live.zoopsign.com/api/pdf-utils/split
    timeout_s: 300            # one request carries the whole merged upload
    rate_per_s: 5             # own limiter, shared by all threads (A-07)
    retries: 3                # 429 / 5xx / timeout / connection error; 401/403 never retried
    backoff_s: 1              # 1 s, 2 s, 4 s …
    max_total_s: 400          # no new retry after this; worst case ≈ max_total_s + timeout_s
  ocr:                        # contract: docs/api-samples/ocr/README.md
    url_env: ESTAMP_OCR_URL   # PRODUCTION endpoint comes from .env; dev falls back to `url` below
    url: https://dev-ai.zoop.one/parsely-top-layer/v1/ocr/do   # dev fallback only – set ESTAMP_OCR_URL for go-live
    config_id: ocrc_2f0e4e33ae22475f976e4787d62e08e2
    api_key_env: ZOOP_OCR_API_KEY       # names of the .env variables – never the values
    org_acc_env: ZOOP_OCR_ORG_ACC
    timeout_s: 60             # per try, per page (real pages took 1–3 s)
    rate_per_s: 5             # HANDOFF A3: max 5 OCR requests/second, shared by intake + issue check (A-07)
    retries: 3
    backoff_s: 1
    max_total_s: 120          # per page, including retries (the 83-min Drive OCR read must not repeat)

alerts:
  slack_webhook_env: ESTAMP_SLACK_WEBHOOK
  heartbeat_url_env: ESTAMP_HEARTBEAT_URL
  in_dry_run: false
  stuck_minutes: 15
  daily_summary_hour: 20
  smtp:
    host: ""
    port: 587
    user_env: ESTAMP_SMTP_USER
    password_env: ESTAMP_SMTP_PASSWORD
    from: ""
    to: [vaibhav.sharma@zoop.one]
